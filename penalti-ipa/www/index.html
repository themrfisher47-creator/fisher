<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penaltı Atışları – Retro</title>
<style>
:root{--bg:#dfe5ec;--fg:#1b2430;--card:#9aa7b6;--ch:36px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--fg:#e6edf3;--card:#2a3340}}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--card:#2a3340}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;max-width:calc((100dvh - var(--ch) - 16px)*1.6);image-rendering:pixelated;border:3px solid var(--card)}
.hint{font-size:11px;margin-top:8px;opacity:.8;text-align:center;padding:0 8px}
.ctl{display:none;width:100%;max-width:520px;height:150px;position:relative;margin-top:6px}
#js{position:absolute;left:12px;bottom:6px;width:130px;height:130px;background:rgba(127,127,127,.22);border:3px solid rgba(127,127,127,.55);touch-action:none}
#kn{position:absolute;left:36px;top:36px;width:52px;height:52px;background:rgba(127,127,127,.75);pointer-events:none}
.b{position:absolute;right:24px;bottom:22px;width:104px;height:104px;border:3px solid rgba(127,127,127,.7);background:rgba(127,127,127,.28);color:var(--fg);font:bold 16px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
.b.on{background:#ffd23f;color:#000;border-color:#ffd23f}
@media (pointer:coarse){:root{--ch:170px}.ctl{display:block}.hint{display:none}}
@media (pointer:coarse) and (orientation:landscape){:root{--ch:0px}.ctl{position:fixed;left:0;right:0;bottom:calc(4px + env(safe-area-inset-bottom,0px));max-width:none;margin:0;pointer-events:none}.ctl>*{pointer-events:auto}}

/* --- Minimal 3 Nokta & Gamepad Ayar Menüsü (Retro Stil) --- */
#gp-menu-btn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:28px;height:28px;background:rgba(13,17,23,.72);color:#e6edf3;border:2px solid var(--card);font:bold 16px/1 ui-monospace,monospace;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;padding:0;transition:border-color .15s,background .15s}
#gp-menu-btn:hover{border-color:#ffd23f;color:#ffd23f}
#gp-menu-btn.connected{border-color:#5be37d}
#gp-menu-btn.connected::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;background:#5be37d}

#gp-modal{display:none;position:fixed;inset:0;background:rgba(5,8,14,.84);z-index:30;align-items:center;justify-content:center;padding:12px}
#gp-modal.open{display:flex}
.gp-box{width:100%;max-width:340px;background:#0d1117;color:#e6edf3;border:3px solid #4a5463;padding:12px 14px;font-size:11px;box-shadow:0 8px 24px rgba(0,0,0,.65)}
.gp-hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #2a3340;padding-bottom:6px;margin-bottom:8px}
.gp-hdr span{color:#ffd23f;font-weight:bold;font-size:13px;letter-spacing:.5px}
.gp-status{background:#161b22;border:1px solid #30363d;padding:6px 8px;margin-bottom:10px;font-size:10px;line-height:1.35;color:#9aa7b6;word-break:break-word}
.gp-status.ok{border-color:#2ea043;color:#6bff8a}
.gp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px}
.gp-row label{color:#cbd5e1;font-size:11px}
.gp-bind{min-width:116px;padding:5px 8px;background:#1f2630;color:#fff;border:2px solid #4a5463;font:bold 10px ui-monospace,monospace;cursor:pointer;text-align:center}
.gp-bind:hover{border-color:#ffd23f}
.gp-bind.wait{background:#ffd23f;color:#000;border-color:#fff;animation:gpBlink .6s infinite alternate}
@keyframes gpBlink{from{opacity:1}to{opacity:.65}}
.gp-foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:8px;border-top:2px solid #2a3340}
.gp-btn{flex:1;padding:6px 8px;background:#212832;color:#e6edf3;border:2px solid #4a5463;font:bold 11px ui-monospace,monospace;cursor:pointer}
.gp-btn:hover{border-color:#ffd23f;color:#ffd23f}
.gp-btn.pri{background:#2f6fe0;border-color:#6ea8fe;color:#fff}
.gp-btn.pri:hover{background:#3b7ef2}
.gp-tip{margin-top:8px;font-size:9px;color:#8b949e;text-align:center}
</style></head><body>
<button id="gp-menu-btn" title="Oyun Kolu Ayarları" aria-label="Oyun Kolu Ayarları">⋮</button>

<div id="gp-modal" role="dialog" aria-modal="true" aria-labelledby="gp-title">
  <div class="gp-box">
    <div class="gp-hdr">
      <span id="gp-title">🎮 OYUN KOLU AYARLARI</span>
    </div>
    <div id="gp-status" class="gp-status">Oyun kolu bekleniyor... Koldaki herhangi bir tuşa basın.</div>

    <div class="gp-row">
      <label>Şut / Kilit (Ana)</label>
      <button type="button" class="gp-bind" data-bind="shoot1">Tuş 0 (A/X)</button>
    </div>
    <div class="gp-row">
      <label>Şut / Kilit (Yedek)</label>
      <button type="button" class="gp-bind" data-bind="shoot2">Tuş 2 (X/□)</button>
    </div>
    <div class="gp-row">
      <label>Başlat / Tekrar</label>
      <button type="button" class="gp-bind" data-bind="start">Tuş 9 (Start)</button>
    </div>
    <div class="gp-row">
      <label>Yön Kontrolü</label>
      <button type="button" class="gp-bind" id="gp-dir-mode">Analog + D-Pad</button>
    </div>
    <div class="gp-row">
      <label>Y Ekseni (Yukarı/Aşağı)</label>
      <button type="button" class="gp-bind" id="gp-inv-y">Normal</button>
    </div>
    <div class="gp-row">
      <label>Titreşim (Rumble)</label>
      <button type="button" class="gp-bind" id="gp-vib">Açık</button>
    </div>

    <div class="gp-tip">Değiştirmek için kutuya tıklayıp koldan tuşa basın.</div>
    <div class="gp-foot">
      <button type="button" class="gp-btn" id="gp-reset">Varsayılan</button>
      <button type="button" class="gp-btn pri" id="gp-close">Kapat</button>
    </div>
  </div>
</div>

<canvas id="c" width="320" height="200"></canvas>
<div class="hint">Atışta: OK/WASD nişan · K/J basılı tut = güç, bırak = şut · Kalecide: yön tuşu = at (↑ üst, ↓ alt), K = kilitle</div>
<div class="ctl"><div id="js"><div id="kn"></div></div><div class="b" data-k="shoot">ŞUT / KİLİT</div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=320,H=200,GX0=96,GX1=224,GT=79,GL=122,SX=160,SY=160,RU=.32;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hyp=Math.hypot;
let seed=11;const sr=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ---- Oyun Kolu (Gamepad) Yapılandırma ve Yönetim ---- */
const GP_KEY='penalti_retro_gp_v1';
const GP_DEF={shoot1:0,shoot2:2,start:9,dirMode:'both',invertY:false,vibrate:true};
let gpCfg={...GP_DEF};
try{const saved=JSON.parse(localStorage.getItem(GP_KEY));if(saved)gpCfg={...GP_DEF,...saved}}catch(e){}
const saveGp=()=>{try{localStorage.setItem(GP_KEY,JSON.stringify(gpCfg))}catch(e){}};

let gpModalOpen=false,gpListening=null,gpPrevBtns=[],gpStartLatch=false;
const gpMenuBtn=document.getElementById('gp-menu-btn');
const gpModal=document.getElementById('gp-modal');
const gpStatusEl=document.getElementById('gp-status');
const gpDirBtn=document.getElementById('gp-dir-mode');
const gpInvBtn=document.getElementById('gp-inv-y');
const gpVibBtn=document.getElementById('gp-vib');

const BTN_NAMES={0:'Tuş 0 (A / ✕)',1:'Tuş 1 (B / ○)',2:'Tuş 2 (X / □)',3:'Tuş 3 (Y / △)',4:'Tuş 4 (L1 / LB)',5:'Tuş 5 (R1 / RB)',6:'Tuş 6 (L2 / LT)',7:'Tuş 7 (R2 / RT)',8:'Tuş 8 (Select)',9:'Tuş 9 (Start)',10:'Tuş 10 (L3)',11:'Tuş 11 (R3)'};
const btnLabel=idx=>idx===null||idx===undefined?'Atanmadı':(BTN_NAMES[idx]||`Tuş ${idx}`);
const DIR_LABELS={both:'Analog + D-Pad',stick:'Sadece Analog',dpad:'Sadece D-Pad'};

function getActiveGamepad(){
  if(!navigator.getGamepads)return null;
  const list=navigator.getGamepads();
  for(let i=0;i<list.length;i++)if(list[i]&&list[i].connected)return list[i];
  return null;
}

function updateGpUI(){
  document.querySelectorAll('.gp-bind[data-bind]').forEach(el=>{
    const key=el.dataset.bind;
    if(gpListening===key){
      el.textContent='Tuşa Basın...';
      el.classList.add('wait');
    }else{
      el.textContent=btnLabel(gpCfg[key]);
      el.classList.remove('wait');
    }
  });
  gpDirBtn.textContent=DIR_LABELS[gpCfg.dirMode]||DIR_LABELS.both;
  gpInvBtn.textContent=gpCfg.invertY?'Ters (Uçak)':'Normal';
  gpVibBtn.textContent=gpCfg.vibrate?'Açık':'Kapalı';

  const gp=getActiveGamepad();
  if(gp){
    gpMenuBtn.classList.add('connected');
    gpStatusEl.classList.add('ok');
    gpStatusEl.textContent=`Bağlı Kol: ${gp.id.slice(0,42)}`;
  }else{
    gpMenuBtn.classList.remove('connected');
    gpStatusEl.classList.remove('ok');
    gpStatusEl.textContent='Oyun kolu bekleniyor... Koldaki herhangi bir tuşa basın.';
  }
}

function openGpModal(){
  gpModalOpen=true;
  gpListening=null;
  const gp=getActiveGamepad();
  gpPrevBtns=gp?gp.buttons.map(b=>b.pressed):[];
  updateGpUI();
  gpModal.classList.add('open');
}
function closeGpModal(){
  gpModalOpen=false;
  gpListening=null;
  gpModal.classList.remove('open');
}

gpMenuBtn.addEventListener('click',e=>{e.stopPropagation();au();gpModalOpen?closeGpModal():openGpModal()});
document.getElementById('gp-close').addEventListener('click',()=>{au();closeGpModal()});
document.getElementById('gp-reset').addEventListener('click',()=>{au();gpCfg={...GP_DEF};gpListening=null;saveGp();updateGpUI();beep(660,.08,'square',.04)});
gpModal.addEventListener('pointerdown',e=>{if(e.target===gpModal)closeGpModal()});

document.querySelectorAll('.gp-bind[data-bind]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    au();
    const gp=getActiveGamepad();
    gpPrevBtns=gp?gp.buttons.map(b=>b.pressed):[];
    gpListening=gpListening===btn.dataset.bind?null:btn.dataset.bind;
    updateGpUI();
  });
});

gpDirBtn.addEventListener('click',()=>{
  au();
  const order=['both','stick','dpad'];
  gpCfg.dirMode=order[(order.indexOf(gpCfg.dirMode)+1)%order.length];
  saveGp();updateGpUI();
});
gpInvBtn.addEventListener('click',()=>{
  au();gpCfg.invertY=!gpCfg.invertY;saveGp();updateGpUI();
});
gpVibBtn.addEventListener('click',()=>{
  au();gpCfg.vibrate=!gpCfg.vibrate;saveGp();updateGpUI();
  if(gpCfg.vibrate)buzz();
});

addEventListener('gamepadconnected',()=>{updateGpUI()});
addEventListener('gamepaddisconnected',()=>{updateGpUI()});

function pollGamepadSetup(){
  const gp=getActiveGamepad();
  if(gp&&!gpMenuBtn.classList.contains('connected'))updateGpUI();
  else if(!gp&&gpMenuBtn.classList.contains('connected'))updateGpUI();

  if(!gpModalOpen||!gp)return;
  if(gpStatusEl&&!gpStatusEl.classList.contains('ok'))updateGpUI();

  if(gpListening){
    for(let i=0;i<gp.buttons.length;i++){
      const pressed=gp.buttons[i].pressed||gp.buttons[i].value>0.65;
      const was=gpPrevBtns[i]||false;
      // D-pad (12..15) yön için ayrıldığından tuş atamasına dahil edilmez
      if(pressed&&!was&&(i<12||i>15)){
        gpCfg[gpListening]=i;
        gpListening=null;
        saveGp();
        updateGpUI();
        beep(880,.08,'square',.05);
        break;
      }
    }
  }
  gpPrevBtns=gp.buttons.map(b=>b.pressed||b.value>0.65);
}

function readGamepadInput(){
  const gp=getActiveGamepad();
  if(!gp)return{x:0,y:0,shoot:false,start:false};
  const dz=0.22;
  let sx=0,sy=0;
  if(gpCfg.dirMode!=='dpad'&&gp.axes&&gp.axes.length>=2){
    const ax0=gp.axes[0],ay0=gp.axes[1];
    sx=Math.abs(ax0)>dz?(ax0-Math.sign(ax0)*dz)/(1-dz):0;
    sy=Math.abs(ay0)>dz?(ay0-Math.sign(ay0)*dz)/(1-dz):0;
  }
  let dx=0,dy=0;
  if(gpCfg.dirMode!=='stick'&&gp.buttons&&gp.buttons.length>=16){
    dx=(gp.buttons[15].pressed?1:0)-(gp.buttons[14].pressed?1:0);
    dy=(gp.buttons[13].pressed?1:0)-(gp.buttons[12].pressed?1:0);
  }
  let x=Math.abs(dx)>Math.abs(sx)?dx:sx;
  let y=Math.abs(dy)>Math.abs(sy)?dy:sy;
  if(gpCfg.invertY)y=-y;

  const isBtn=idx=>idx!==null&&idx!==undefined&&gp.buttons[idx]&&(gp.buttons[idx].pressed||gp.buttons[idx].value>0.5);
  const shoot=!!(isBtn(gpCfg.shoot1)||isBtn(gpCfg.shoot2));
  const start=!!isBtn(gpCfg.start);
  return{x:cl(x,-1,1),y:cl(y,-1,1),shoot,start};
}

/* ---- statik sahne ---- */
const pit=document.createElement('canvas');pit.width=W;pit.height=H;
(function(){const p=pit.getContext('2d'),r=(c,x,y,w,h)=>{p.fillStyle=c;p.fillRect(x,y,w,h)};
 r('#1a1f29',0,0,W,H);for(let y=0;y<44;y+=5)r(y/5%2?'#222834':'#1d222c',0,y,W,5);
 for(let y=50,k=0;y<H;y+=15,k++)r(k%2?'#2e8b3a':'#37984a',0,y,W,15);
 for(let i=0;i<2200;i++)r(sr()<.5?'rgba(0,0,0,.09)':'rgba(255,255,255,.08)',sr()*W|0,50+(sr()*150|0),1,1);
 const bc=['#c0392b','#f1c40f','#2980b9','#27ae60'];for(let x=0;x<W;x+=40){r(bc[x/40%4],x,44,40,6);p.fillStyle='#fff';p.font='bold 5px monospace';p.textBaseline='top';p.fillText('PENALTI',x+6,45)}
 // kale ağı
 r('#141a22',GX0,GT,GX1-GX0,GL-GT);p.fillStyle='rgba(255,255,255,.22)';
 for(let x=GX0;x<GX1;x+=4)p.fillRect(x,GT,1,GL-GT);for(let y=GT;y<GL;y+=4)p.fillRect(GX0,y,GX1-GX0,1);
 r('rgba(0,0,0,.35)',GX0,GT,GX1-GX0,6);
 const wl='#e9f2e4';r(wl,20,GL,280,1);r(wl,60,GL,1,78);r(wl,260,GL,1,78);r(wl,60,185,200,1);r(wl,SX-1,SY,3,3);
 r('#fff',GX0-3,GT-3,3,GL-GT+3);r('#fff',GX1,GT-3,3,GL-GT+3);r('#fff',GX0-3,GT-3,GX1-GX0+6,3);
})();

/* ---- durum ---- */
const hairs=['#2a1a10','#e6c04a','#b5532a','#111','#6b6b6b'],skins=['#f1c39b','#d89a6a','#8d5a38','#f6d2b0'];
let state='menu',res=[[],[]],turn=0,shooter=0,winner=-1,ax=160,ay=90,chg=0,armed=false,tm=0,kt=0,rt=0,pend=null,out=null,dk=null,lock=false,msg='',fx=[],shake=0,crowdT=0,I={},pI={};
let kicker,keeper,kx=140,ky=190,kpx=160,kpj=0,bx=SX,by=SY,bs=5,FT=.6,B={x:SX,z:0,h:3,vx:0,vz:0,vh:0,held:0,hit:0,inNet:0,pw:.5,t:0},netHit=null,kRot=0,kDur=.42,kRd=.1;
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ---- ses ---- */
let ac;function au(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function beep(f,du,ty='square',v=.05,sl=0){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),n=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+du);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+du);o.connect(n).connect(ac.destination);o.start();o.stop(t+du)}
function buzz(){if(!gpCfg.vibrate)return;try{if(navigator.vibrate)navigator.vibrate([45,30,25]);const gps=navigator.getGamepads?navigator.getGamepads():[];for(const gp of gps)if(gp&&gp.vibrationActuator&&gp.vibrationActuator.playEffect)gp.vibrationActuator.playEffect('dual-rumble',{duration:140,strongMagnitude:.8,weakMagnitude:.5})}catch(e){}}
function tin(){buzz();if(!ac)return;const t=ac.currentTime;[[1760,.14,1.2],[2637,.08,.9],[3520,.05,.6],[5274,.03,.35]].forEach(([f,v,d])=>{const o=ac.createOscillator(),n=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.985,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(n).connect(ac.destination);o.start(t);o.stop(t+d)})}
function roar(){if(!ac)return;const t=ac.currentTime,len=ac.sampleRate*3,bf=ac.createBuffer(1,len,ac.sampleRate),a=bf.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),n=ac.createGain();s.buffer=bf;f.type='lowpass';f.frequency.value=1100;n.gain.setValueAtTime(.001,t);n.gain.exponentialRampToValueAtTime(.2,t+.3);n.gain.exponentialRampToValueAtTime(.001,t+3);s.connect(f).connect(n).connect(ac.destination);s.start();[523,659,784,1047].forEach((q,i)=>setTimeout(()=>beep(q,.18,'square',.05),i*120))}

/* ---- girdi ---- */
const K={},Tc={x:0,y:0};
function startGame(){au();res=[[],[]];turn=0;winner=-1;fx=[];beginTurn();beep(1500,.35,'sine',.06)}
addEventListener('keydown',e=>{
  if(e.code==='Escape'&&gpModalOpen){closeGpModal();return}
  if(gpModalOpen)return;
  K[e.code]=1;au();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if((state==='menu'||state==='end')&&['Enter','Space','KeyJ','KeyK'].includes(e.code))startGame()
});
addEventListener('keyup',e=>K[e.code]=0);
cv.addEventListener('pointerdown',()=>{if(gpModalOpen)return;au();if(state==='menu'||state==='end')startGame()});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,up=()=>{Tc[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',e=>{if(gpModalOpen)return;e.preventDefault();au();Tc[k]=1;b.classList.add('on');b.setPointerCapture(e.pointerId);if(state==='menu'||state==='end')startGame()});b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});
const js=document.getElementById('js'),kn=document.getElementById('kn');
function jm(e){const r=js.getBoundingClientRect(),R0=r.width/2-20;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const dd=hyp(dx,dy),k=dd>R0?R0/dd:1;dx*=k;dy*=k;kn.style.transform=`translate(${dx}px,${dy}px)`;Tc.x=dx/R0;Tc.y=dy/R0}
const je=()=>{Tc.x=Tc.y=0;kn.style.transform=''};
js.addEventListener('pointerdown',e=>{if(gpModalOpen)return;au();js.setPointerCapture(e.pointerId);jm(e);if(state==='menu'||state==='end')startGame()});
js.addEventListener('pointermove',e=>{if(js.hasPointerCapture(e.pointerId))jm(e)});js.addEventListener('pointerup',je);js.addEventListener('pointercancel',je);
function readI(){
  if(gpModalOpen){I={x:0,y:0,shoot:false};return}
  let x=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0),y=(K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0);
  if(Tc.x||Tc.y){x=Tc.x;y=Tc.y}
  const gpI=readGamepadInput();
  if(Math.abs(gpI.x)>Math.abs(x))x=gpI.x;
  if(Math.abs(gpI.y)>Math.abs(y))y=gpI.y;
  const shoot=!!(K.KeyK||K.KeyJ||K.Space||Tc.shoot||gpI.shoot);
  I={x,y,shoot};
  const gpTrigger=gpI.shoot||gpI.start;
  if((state==='menu'||state==='end')&&gpTrigger&&!gpStartLatch){startGame()}
  gpStartLatch=gpTrigger;
}
const rel=()=>!I.shoot&&pI.shoot,prs=()=>I.shoot&&!pI.shoot;

/* ---- oyun mantığı ---- */

function seg(a,b,r,e,mu,vs,cb){const q=P.q,ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],L=D(ab,ab),t=L?cl(D([q[0]-a[0],q[1]-a[1],q[2]-a[2]],ab)/L,0,1):0,Q=[a[0]+ab[0]*t,a[1]+ab[1]*t,a[2]+ab[2]*t],d=[q[0]-Q[0],q[1]-Q[1],q[2]-Q[2]],m=hyp(d[0],d[1],d[2]);if(m>=R0+r||m<1e-6)return 0;

 const vr=-D([P.v[0]-vs[0],P.v[1]-vs[1],P.v[2]-vs[2]],n);if(cb&&cb(t,m,vr))return{t,m};col(n,e,mu,vs);return{t,m}}
function phys(dt,A,H){const q=P.q,v=P.v,w=P.w,R=R0,a=acc(v,w);for(let i=0;i<3;i++){v[i]+=a[i]*dt;q[i]+=v[i]*dt}

 for(const sx of[-3.72,3.72])if(seg([sx,0,11],[sx,2.5,11],.06,.72,.25,[0,0,0])){P.hit=1;tin()}
 if(seg([-3.72,2.5,11],[3.72,2.5,11],.06,.72,.25,[0,0,0])){P.hit=1;tin()}
 if(!P.held){const r=seg([A[0],A[1],10.9],[H[0],H[1],10.9],.3,.25,.6,[out.vk||0,0,0],(t,m,vr)=>{if(t>.72&&m<.27&&vr<15){P.held=1;return 1}});if(r&&!out.kt){out.kt=1;beep(200,.08,'square',.06)}}
 if(q[1]<R){q[1]=R;col([0,1,0],v[1]<-1.5?.62:0,.55,[0,0,0])}
 if(q[1]<=R+.002&&Math.abs(v[1])<.5){const f=Math.exp(-(P.in?2.2:.55)*dt);v[0]*=f;v[2]*=f;w[0]*=f;w[1]*=f;w[2]*=f}
 if(P.in){const pen=(n,d)=>{if(d<=0)return;const dv=D(v,n),f=Math.min(d,.9)*650+Math.max(dv,0)*42;for(let i=0;i<3;i++)v[i]-=f*n[i]*dt;if(d>.05&&crowdT-(P.nt||-9)>.3){P.nt=crowdT;const s=proj(q[0],q[1],q[2]);netHit={x:s[0],y:s[1],t:crowdT};if(dv>3)ping()}};
  pen([1,0,0],q[0]-(3.66-R));pen([-1,0,0],-q[0]-(3.66-R));pen([0,1,0],q[1]-(2.44-R));pen([0,.379,.924],(q[2]-12.1)*.924+(q[1]-2.44)*.379+R);
  const f=Math.exp(-1.4*dt);v[0]*=f;v[1]*=f;v[2]*=f}}

function fly(v0,w){let q=[0,R0,0],v=v0.slice(),t=0;for(let i=0;i<700;i++){const a=acc(v,w),dt=.005;for(let j=0;j<3;j++)v[j]+=a[j]*dt;const n=[q[0]+v[0]*dt,q[1]+v[1]*dt,q[2]+v[2]*dt];if(n[2]>=11){const f=(11-q[2])/(n[2]-q[2]);return{x:q[0]+(n[0]-q[0])*f,y:q[1]+(n[1]-q[1])*f,t:t+dt*f}}q=n;t+=dt}return{x:q[0],y:q[1],t:3.5}}
function shotInit(){const p=pend,tx=(p.tx-160)/SG,ty=Math.max(.15,(GL-p.ty)/SG);FT=cl(.85-.4*p.pw,.45,.8);

 for(let i=0;i<9;i++){const s=fly(v,w);v[0]-=(s.x-tx)/s.t;v[1]-=(s.y-ty)/s.t;v[2]*=s.t/FT}

 else{kRd=.05;if(!lock)dk={col:I.x<-.35?0:I.x>.35?2:1,row:I.y<-.35?0:I.y>.35?1:null};out.xT=(dk.col-1)*2.3;ht=dk.row===0?2:dk.row===1?.4:1.1}
 const dx=out.xT-out.x0,sg=Math.sign(dx),far=Math.abs(dx)>.5,hi=ht>1.45,lo=ht<.7;
 out.th=far?sg*(hi?.75:lo?1.4:1.05):0;out.jT=far?(hi?.55:lo?-.4:0):(hi?.5:lo?-.15:0);kDur=.3+.12*Math.abs(dx);

 let x=c*2.3+rnd(-.5,.5),y=Math.random()<.5?rnd(1.5,2.2):rnd(.2,.9);const m=Math.random();
 if(m<.07){x=(Math.random()<.5?-1:1)*rnd(3.4,3.75);y=rnd(.4,2.3)}else if(m<.11)y=rnd(2.5,3.1);

 kpx=160+x*SG;kpj=jm*16.6;kRot=th;const py=.72+jm,s=Math.sin(th),c=Math.cos(th),A=[x-s*.72,py-c*.72],H=[x+s*1.58,py+c*1.58];

 if(p.held){p.q=[H[0],H[1]-.15,10.9];p.v=[0,0,0]}

function ln(a,b,c){const n=Math.ceil(Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])))||1;g.fillStyle=c;for(let i=0;i<=n;i++){let x=a[0]+(b[0]-a[0])*i/n,y=a[1]+(b[1]-a[1])*i/n;if(RP){const dx=x-RP.x,dy=y-RP.y,d=hyp(dx,dy);if(d<30){const o=RP.am*Math.sin(RP.a*24-d*.3)*(1-d/30)/(d+1);x+=dx*o;y+=dy*o}}g.fillRect(x|0,y|0,1,1)}}

 ln(pj(a,H,12.1),pj(b,H,12.1),sp);ln(pj(a,0,13.1),pj(b,0,13.1),sp)}
